# The submission fee (CONTRIBUTING.md). Every 15 minutes this reads the open pull
# requests, checks each outside contributor's fee payment (USDC on Base, or SLOP on
# Robinhood Chain), and labels, comments, closes or reopens. The rules and the on/off switch are `.github/submission-fee.json`;
# while `enabled` is false there, a run prints one line and changes nothing.
#
# Scheduled, so it always runs `main`'s own copy of the script with the repository's own
# token. It never checks out a pull request's code. Not `pull_request_target`: nothing
# here runs because a pull request arrived.
#
# Two jobs. `check` needs no secret and moves no money. `refund` runs when `check`
# reports a refund or a burn waiting (or on a manual run) and does nothing unless the
# settings name a `refundWallet`; it sends each refund that is due, and each kept SLOP
# fee to the burn address, from the wallet whose key is the secret REFUND_WALLET_KEY of the environment
# `submission-fee-refunds`. That environment allows the `main` branch only, so a workflow
# on any other branch cannot read the key.

name: submission-fee

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: submission-fee
  cancel-in-progress: false

jobs:
  check:
    # A manual run from another branch would run that branch's script with this token.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      refunds: ${{ steps.fees.outputs.refunds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Check submission fees
        id: fees
        run: node checks/submission-fee.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional: another endpoint for a chain, when the public one is refusing requests.
          BASE_RPC_URL: ${{ vars.BASE_RPC_URL }}
          ROBINHOOD_RPC_URL: ${{ vars.ROBINHOOD_RPC_URL }}

  refund:
    needs: check
    # Also on a manual run, which sends nothing when nothing is due but still proves the
    # key belongs to the refund wallet and prints what the wallet holds.
    if: needs.check.outputs.refunds == 'pending' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: submission-fee-refunds
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      # One pinned dependency, for signing. No install scripts run.
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix checks/refund
      - name: Send refunds and burns that are due
        run: node checks/submission-fee-refund.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_RPC_URL: ${{ vars.BASE_RPC_URL }}
          ROBINHOOD_RPC_URL: ${{ vars.ROBINHOOD_RPC_URL }}
          REFUND_WALLET_KEY: ${{ secrets.REFUND_WALLET_KEY }}
